name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'newicons/appfilter.xml'
      - 'newicons/**.svg'

permissions:
  contents: read

jobs:
  check_appfilter:
    name: Check appfilter.xml from pull_request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      CommentPRtext: ${{ steps.validate.outputs.text }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.user.login }}/${{ github.event.pull_request.head.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout Repository ${{ github.event.pull_request.user.login }}/${{ github.event.pull_request.head.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            newicons/appfilter.xml
          sparse-checkout-cone-mode: false
      - name: Install xmllint
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y libxml2-utils
      - name: Validate appfilter.xml
        id: validate
        run: |
          if ! PARSE_OUTPUT=$(xmllint --noout newicons/appfilter.xml 2>&1 >/dev/null); then
            echo "Parsing appfilter.xml failed."
            echo "text<<EOF" >> "$GITHUB_OUTPUT"
            echo "$PARSE_OUTPUT" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "Parsing succeeded."
          fi

  check_appfilter_and_icons:
    name: Run Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      CommentPRtext: ${{ steps.validate.outputs.text }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.user.login }}/${{ github.event.pull_request.head.ref }}-check
      cancel-in-progress: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{vars.MAIN_BRANCH}}
          persist-credentials: false
      - name: Checkout Repository ${{ github.event.pull_request.user.login }}/${{ github.event.pull_request.head.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          sparse-checkout: |
            newicons/appfilter.xml
            newicons/*.svg
          sparse-checkout-cone-mode: false
          path: temp-pr
      - name: Populate newicons folder
        shell: bash
        run: |
          rm -rf newicons
          mkdir -p newicons
          find temp-pr/newicons -maxdepth 1 -type f \( -name 'appfilter.xml' -o -name '*.svg' \) -exec cp -- {} newicons/ \;
          rm -rf temp-pr
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Get Gradle
        run: gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run checks
        id: validate
        shell: bash
        run: |
          if ! PARSE_OUTPUT=$(./gradlew checkonly --no-build-cache --no-configuration-cache --no-daemon 2>&1 >/dev/null) ; then
            echo "Checks failed."
            FILTERED_OUTPUT=$(echo "$PARSE_OUTPUT" | sed -n '/============================================================/,/Total Failures:/p')
            echo "text<<EOF" >> "$GITHUB_OUTPUT"
            echo "$FILTERED_OUTPUT" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "Checks succeeded."
          fi

  comment_pr_check_appfilter:
    name: Comment on PR
    needs: ['check_appfilter','check_appfilter_and_icons']
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      PARSE_OUTPUT: ${{needs.check_appfilter.outputs.CommentPRtext}}
      CHECK_OUTPUT: ${{needs.check_appfilter_and_icons.outputs.CommentPRtext}}
    steps:
      - name: Create Comment File
        run: |
          touch comment_markdown.md
          if [ -n "$PARSE_OUTPUT" ]; then
            echo "Parsing of 'newicons/appfilter.xml' failed. Please fix the XML syntax errors." >> comment_markdown.md
            echo '```' >> comment_markdown.md
            echo "$PARSE_OUTPUT" >> comment_markdown.md
            echo '```' >> comment_markdown.md
          fi
          if [ -n "$CHECK_OUTPUT" ]; then
            echo "Checks failed." >> comment_markdown.md
            echo '```' >> comment_markdown.md
            echo "$CHECK_OUTPUT" >> comment_markdown.md
            echo '```' >> comment_markdown.md
          fi
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-failure
          path: comment_markdown.md
